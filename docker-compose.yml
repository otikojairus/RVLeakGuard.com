name: firetagpros

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://firetagpros.com}
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
